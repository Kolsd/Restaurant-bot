<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Menú del Restaurante</title>
<meta name="description" content="Catálogo visual del restaurante — haz tu pedido por WhatsApp">
<meta name="theme-color" content="#1D9E75">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/catalog-v2.css">
</head>
<body>

<!-- Skip navigation -->
<a href="#catalog-main" class="skip-link">Ir al menú</a>

<!-- Live region for filter announcements -->
<div id="filter-announcer" class="filter-announcer" aria-live="polite" aria-atomic="true"></div>

<!-- Root mount point -->
<div id="catalog-root">

  <!-- RestaurantHeader -->
  <header class="restaurant-header" id="catalog-header" aria-label="Información del restaurante">
    <!-- Rendered by JS -->
  </header>

  <!-- HeroCarousel (conditional: featuredDishes.length > 0) -->
  <section id="catalog-hero" class="hero-carousel" aria-label="Platos destacados" style="display:none">
    <!-- Rendered by JS -->
  </section>

  <!-- StickyNav -->
  <nav id="catalog-nav" class="sticky-nav" aria-label="Navegación del menú">
    <!-- Rendered by JS -->
  </nav>

  <!-- Error banner (hidden by default) -->
  <div id="error-banner" class="error-banner" role="alert" aria-live="assertive" style="display:none">
    <span id="error-message">No pudimos cargar el menú</span>
    <button class="error-retry-btn" id="error-retry" type="button">Reintentar</button>
  </div>

  <!-- Main catalog content -->
  <main id="catalog-main" tabindex="-1" aria-label="Menú del restaurante">
    <!-- Rendered by JS: CategoryList → DishGrid → DishCard -->
  </main>

</div>

<!-- CartFooter (sticky bottom, shown when cart has items) -->
<footer id="catalog-footer" class="cart-footer" aria-label="Carrito de pedido" style="display:none">
  <div class="cart-footer-inner">
    <!-- Rendered by JS -->
  </div>
</footer>

<!-- Scripts -->
<script src="/static/js/mesio-utils.js"></script>
<script src="/static/js/catalog-v2.js"></script>
</body>
</html>
