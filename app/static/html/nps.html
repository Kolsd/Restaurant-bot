<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mesio — NPS &amp; Reseñas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/shared.css">
<link rel="stylesheet" href="/static/css/pages/nps.css">
</head>
<body data-active="nps">

<div class="app">
  <aside class="sidebar" data-active="nps"></aside>
  <main class="main">
    <div class="topbar">
      <div class="row" style="gap: 6px;">
        <a href="/dashboard" style="text-decoration:none;color:inherit;" class="topbar-crumb">Mesio</a>
        <span class="sep topbar-crumb">/</span>
        <span class="topbar-title">NPS &amp; Reseñas</span>
      </div>
      <div class="topbar-right">
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text-3)"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
          <input id="search-input" placeholder="Buscar reseña&hellip;" aria-label="Buscar reseña">
        </div>
      </div>
    </div>

    <div class="page">
      <div class="page-head">
        <div>
          <div class="page-title">NPS &amp; Reseñas</div>
          <div class="page-sub">Encuestas post-consumo de WhatsApp. Responde y gestiona desde un solo lugar.</div>
        </div>
        <div class="row">
          <div class="seg">
            <button class="seg-btn" data-days="7">7d</button>
            <button class="seg-btn active" data-days="30">30d</button>
            <button class="seg-btn" data-days="90">90d</button>
            <button class="seg-btn" data-days="365">1a</button>
          </div>
          <button class="btn" id="btn-send-survey">Enviar encuesta</button>
        </div>
      </div>

      <!-- NPS hero -->
      <div class="nps-hero">
        <div>
          <div class="nps-section-label">NPS actual</div>
          <div class="score-big" id="nps-score">—</div>
          <div class="metric-sub" id="nps-total-label" style="margin-top: 4px; color: var(--text-3);">Sin datos suficientes aún</div>
          <div class="score-ring" id="nps-ring" title="Distribución NPS" style="display: none;">
            <div id="nps-ring-promo" style="background: var(--brand);"></div>
            <div id="nps-ring-pass" style="background: var(--warning);"></div>
            <div id="nps-ring-detr" style="background: var(--danger);"></div>
          </div>
          <div class="score-ring-labels" id="nps-ring-labels" style="display: none;">
            <span id="nps-promoters"></span>
            <span id="nps-passives"></span>
            <span id="nps-detractors"></span>
          </div>
        </div>
      </div>

      <!-- Filters + feed -->
      <div class="card flush">
        <div class="card-head">
          <div>
            <div class="card-title">Feed de encuestas</div>
            <div class="card-sub">Todas las respuestas NPS, ordenadas por fecha</div>
          </div>
          <div class="row">
            <div class="seg">
              <button class="seg-btn active" data-feed-filter="all">Todas</button>
              <button class="seg-btn" data-feed-filter="pending">Pendientes</button>
              <button class="seg-btn" data-feed-filter="urgent">Urgentes</button>
              <button class="seg-btn" data-feed-filter="5star">5&#9733;</button>
              <button class="seg-btn" data-feed-filter="low">1-3&#9733;</button>
            </div>
          </div>
        </div>

        <div id="reviews-feed">
          <div style="padding:24px;color:var(--text-3);font-size:13px;">Cargando reseñas&hellip;</div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="/static/js/mesio-utils.js"></script>
<script src="/static/js/pages/sidebar.js"></script>
<script src="/static/js/pages/nps.js"></script>
</body>
</html>
