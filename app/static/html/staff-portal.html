<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesio — Redirigiendo...</title>
<link rel="icon" type="image/png" href="/static/img/logo.png">
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, #0a5c44 0%, #1D9E75 60%, #25c48f 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
  }
  .loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .logo {
    width: 60px; height: 60px;
    background: rgba(255,255,255,0.2);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800;
  }
  p { font-size: 14px; opacity: 0.8; }
</style>
</head>
<body>
<div class="loader">
  <div class="logo">M</div>
  <p>Redirigiendo al login...</p>
</div>
<script>
  // Preserve ?r= parameter for restaurant context
  const params = new URLSearchParams(window.location.search);
  const r = params.get('r');
  window.location.replace(r ? '/login?r=' + encodeURIComponent(r) : '/login');
</script>
</body>
</html>
