<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{DISH_NAME}} | {{RESTAURANT_NAME}}</title>

  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESCRIPTION}}">
  <meta property="og:image"       content="{{OG_IMAGE}}">
  <meta property="og:url"         content="{{OG_URL}}">
  <meta property="og:site_name"   content="{{RESTAURANT_NAME}}">
  <meta property="product:price:amount"   content="{{PRICE_AMOUNT}}">
  <meta property="product:price:currency" content="{{PRICE_CURRENCY}}">

  <!-- Twitter Card fallback -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="{{OG_TITLE}}">
  <meta name="twitter:description" content="{{OG_DESCRIPTION}}">
  <meta name="twitter:image"       content="{{OG_IMAGE}}">

  <link rel="canonical" href="{{OG_URL}}">

  <!-- Preconnect to Cloudinary CDN for hero image -->
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>

  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Design tokens (inline — this is a standalone SEO page, no external CSS dep) */
    :root {
      --brand:        #1D9E75; /* lint-allow: standalone SEO page — defines its own tokens, no tokens.css dep */
      --brand-dark:   #0F6E56;
      --brand-light:  #E1F5EE;
      --bg:           #f5f5f0;
      --surface:      #ffffff;
      --border:       #e0e0d8;
      --text:         #111827;
      --text-2:       #4B5563;
      --text-3:       #6B7280;
      --radius:       12px;
      --radius-lg:    16px;
      --radius-pill:  9999px;
      --shadow:       0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg:    0 12px 32px rgba(0,0,0,0.10);
      --ease:         0.2s ease;
    }

    /* ── Accessibility: Focus ring ── */
    :focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    /* ── Screen-reader only ── */
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* ── Page ── */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Card (mobile-first, max 520px centered on desktop) ── */
    .card {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: var(--surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
    }

    /* ── Breadcrumb ── */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .breadcrumb a {
      font-size: 0.825rem;
      color: var(--brand);
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color var(--ease);
    }
    .breadcrumb a:hover { color: var(--brand-dark); }
    .breadcrumb__sep {
      font-size: 0.75rem;
      color: var(--text-3);
    }
    .breadcrumb__current {
      font-size: 0.825rem;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 55%;
    }

    /* ── Hero image ── */
    .hero-wrap {
      position: relative;
      width: 100%;
      background: var(--brand-light);
      overflow: hidden;
    }
    .dish-image {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .dish-image:hover { transform: scale(1.015); }

    /* ── Placeholder (no image) ── */
    .placeholder-img {
      width: 100%;
      aspect-ratio: 4/3;
      background: linear-gradient(135deg, var(--brand-light) 0%, #c5e8d6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      color: var(--brand);
    }

    /* ── Content area ── */
    .content {
      padding: 20px 16px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── Restaurant label ── */
    .restaurant-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--brand);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    /* ── Dish name ── */
    .dish-name {
      font-size: 1.65rem;
      font-weight: 800;
      line-height: 1.2;
      color: var(--text);
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }

    /* ── Price badge ── */
    .price-wrap {
      display: inline-flex;
      align-items: center;
      background: var(--brand-light);
      color: var(--brand-dark);
      border-radius: var(--radius-pill);
      padding: 5px 14px;
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 16px;
      width: fit-content;
      letter-spacing: -0.01em;
    }

    /* ── Description ── */
    .description {
      font-size: 0.95rem;
      color: var(--text-2);
      line-height: 1.65;
      margin-bottom: 24px;
    }

    /* ── Spacer pushes CTA to bottom ── */
    .spacer { flex: 1; }

    /* ── Order CTA ── */
    .cta-wrap {
      padding: 0 0 8px;
    }
    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 20px;
      background: var(--brand);
      color: #fff;
      text-decoration: none;
      border-radius: var(--radius-lg);
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 4px 16px rgba(29, 158, 117, 0.35);
      transition: background var(--ease), box-shadow var(--ease), transform var(--ease);
      min-height: 56px; /* WCAG touch target */
    }
    .cta:hover, .cta:focus-visible {
      background: var(--brand-dark);
      box-shadow: 0 6px 20px rgba(29, 158, 117, 0.45);
      transform: translateY(-1px);
    }
    .cta:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(29, 158, 117, 0.25);
    }
    .cta__icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    /* ── Footer ── */
    .page-footer {
      text-align: center;
      padding: 16px 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .footer-brand {
      font-size: 0.75rem;
      color: var(--text-3);
    }
    .footer-brand a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 600;
    }
    .footer-brand a:hover { color: var(--brand-dark); }

    /* ── Desktop: center card with side breathing room ── */
    @media (min-width: 600px) {
      body { padding: 32px 16px; background: var(--bg); }
      .card {
        min-height: auto;
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
      .breadcrumb { position: static; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">

    <!-- Breadcrumb navigation -->
    <nav class="breadcrumb" aria-label="Navegación de menú">
      <a href="{{MENU_URL}}" aria-label="Volver al menú completo de {{RESTAURANT_NAME}}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        Menú
      </a>
      <span class="breadcrumb__sep" aria-hidden="true">/</span>
      <span class="breadcrumb__current">{{DISH_NAME}}</span>
    </nav>

    <!-- Hero image (injected by backend: <img loading="eager"> or .placeholder-img) -->
    <div class="hero-wrap" role="img" aria-label="Imagen de {{DISH_NAME}}">
      {{DISH_IMAGE_HTML}}
    </div>

    <!-- Content -->
    <div class="content">
      <p class="restaurant-label">{{RESTAURANT_NAME}}</p>
      <h1 class="dish-name">{{DISH_NAME}}</h1>
      <div class="price-wrap" aria-label="Precio: {{PRICE_DISPLAY}}">{{PRICE_DISPLAY}}</div>

      <!-- Description (rendered as <p class="description"> by backend, or empty string) -->
      {{DESCRIPTION_HTML}}

      <div class="spacer"></div>

      <!-- Primary CTA -->
      <div class="cta-wrap">
        <a
          class="cta"
          href="{{ORDER_URL}}"
          aria-label="Pedir {{DISH_NAME}} en línea a {{RESTAURANT_NAME}}"
        >
          Pedir en línea
        </a>
      </div>
    </div>

    <!-- Footer -->
    <footer class="page-footer" role="contentinfo">
      <p class="footer-brand">
        Menú gestionado con <a href="https://mesioai.com" target="_blank" rel="noopener noreferrer">Mesio</a>
      </p>
    </footer>

  </main>
</body>
</html>
