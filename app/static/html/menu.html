<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Menú del Restaurante</title>
<meta name="description" content="Catálogo visual del restaurante — haz tu pedido por WhatsApp">
<meta name="theme-color" content="#1D9E75">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/pages/menu.css">
</head>
<body>

<div class="qr-phone" id="qr-phone">

  <!-- Hero -->
  <header class="qr-hero" id="qr-hero">
    <div class="qr-hero-bar">
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="mark-sm">M</span>Mesio
      </div>
      <div id="qr-hero-locale">🌐 ES · 🇨🇴</div>
    </div>
    <div class="qr-rest-name" id="qr-rest-name">Cargando…</div>
    <div class="qr-rest-sub" id="qr-rest-sub"></div>
    <div class="qr-mesa-tag" id="qr-mesa-tag" style="display:none;"></div>
  </header>

  <!-- Category pills — sticky -->
  <nav class="qr-categories" id="qr-categories" aria-label="Categorías del menú"></nav>

  <!-- Main menu content -->
  <main id="qr-main" aria-label="Menú del restaurante">
    <div class="qr-loading">
      <div class="qr-spinner"></div>
      <span>Cargando menú…</span>
    </div>
  </main>

</div><!-- /.qr-phone -->

<!-- Sticky cart bar -->
<div class="qr-cart" id="qr-cart" style="display:none;" role="button" tabindex="0" aria-label="Ver mi orden">
  <div class="qr-cart-left">
    <span class="qr-cart-count" id="qr-cart-count">0</span>
    <span class="qr-cart-total" id="qr-cart-total">$0</span>
  </div>
  <div class="qr-cart-cta">Ver mi orden →</div>
</div>

<script src="/static/js/mesio-utils.js"></script>
<script src="/static/js/pages/menu.js"></script>
</body>
</html>
