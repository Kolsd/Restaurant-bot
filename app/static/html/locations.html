<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mesio — Sucursales</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/shared.css">
<link rel="stylesheet" href="/static/css/pages/locations.css">
</head>
<body data-active="sucursales">

<div class="app">
  <aside class="sidebar" data-active="sucursales"></aside>
  <main class="main">
    <div class="topbar">
      <div class="row" style="gap: 6px;">
        <a href="/dashboard" style="text-decoration:none;color:inherit;" class="topbar-crumb">Mesio</a>
        <span class="sep topbar-crumb">/</span>
        <span class="topbar-title">Sucursales</span>
      </div>
      <div class="topbar-right">
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text-3)"><circle cx="7" cy="7" r="5"/><path d="M11 11l3 3"/></svg>
          <input id="search-input" placeholder="Buscar&hellip;" aria-label="Buscar sucursal">
        </div>
      </div>
    </div>

    <div class="page">
      <div class="page-head">
        <div>
          <div class="page-title">Sucursales</div>
          <div class="page-sub">Tus sedes y rendimiento por ubicación.</div>
        </div>
        <div class="row">
          <div class="seg">
            <button class="seg-btn" data-period="Hoy">Hoy</button>
            <button class="seg-btn active" data-period="7 días">7 días</button>
            <button class="seg-btn" data-period="Mes">Mes</button>
          </div>
          <button class="btn primary" id="btn-add-branch">+ Nueva sucursal</button>
        </div>
      </div>

      <!-- Consolidated banner -->
      <div class="consolidated-banner" style="margin-bottom: 16px;">
        <div class="consolidated-label" id="consolidated-label">Consolidado</div>
        <div class="consolidated-stats">
          <div>
            <div class="consolidated-val" id="consolidated-sales">&mdash;</div>
            <div class="consolidated-sub">Ventas totales</div>
          </div>
          <div>
            <div class="consolidated-val" id="consolidated-tickets">&mdash;</div>
            <div class="consolidated-sub">Tickets</div>
          </div>
          <div>
            <div class="consolidated-val" id="consolidated-nps">&mdash;</div>
            <div class="consolidated-sub">NPS · 30 días</div>
          </div>
          <div>
            <div class="consolidated-val" id="consolidated-staff">&mdash;</div>
            <div class="consolidated-sub">Empleados</div>
          </div>
          <div>
            <div class="consolidated-val brand-glow" id="consolidated-growth">&mdash;</div>
            <div class="consolidated-sub">Crecimiento YoY</div>
          </div>
        </div>
      </div>

      <!-- Branch cards (populated by locations.js from /api/team/branches) -->
      <div id="branches-grid" class="branches-grid" style="margin-bottom: 16px;">
        <div style="padding:24px;color:var(--text-3);font-size:13px;grid-column: 1 / -1;">Cargando sucursales&hellip;</div>
      </div>

<!-- post-v2 sweep: comparison card removed (no backend endpoint exists yet; layout to be revisited) -->

    </div>
  </main>
</div>

<!-- ── Add branch modal ─────────────────────────────────────────── -->
<div class="m-modal-overlay" id="addBranchModal" role="dialog" aria-modal="true" aria-labelledby="addBranchModalTitle">
  <div class="m-modal-box" id="addBranchModalBox">
    <h3 id="addBranchModalTitle">Nueva sucursal</h3>

    <div class="form-field">
      <label for="branchName">Nombre de la sucursal</label>
      <input id="branchName" class="form-input" type="text" placeholder="Ej. Chapinero" />
    </div>

    <div class="form-field">
      <label for="branchAddress">Dirección</label>
      <input id="branchAddress" class="form-input" type="text" placeholder="Cra 13 #63-20" />
    </div>

    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
      <button class="btn" id="addBranchModalCancel">Cancelar</button>
      <button class="btn brand" id="addBranchModalSubmit">Crear sucursal</button>
    </div>
    <button class="icon-btn" id="addBranchModalClose" style="position:absolute;top:16px;right:16px;" aria-label="Cerrar modal">&#x2715;</button>
  </div>
</div>

<!-- ── Delivery/pickup config modal (per-sede, docs/claude/delivery-web.md chunk 8) ── -->
<div class="m-modal-overlay" id="deliveryConfigModal" role="dialog" aria-modal="true" aria-labelledby="deliveryConfigModalTitle">
  <div class="m-modal-box" id="deliveryConfigModalBox" style="max-width:520px;">
    <h3 id="deliveryConfigModalTitle">Sede <span id="dcSedeName"></span> · domicilios y pagos</h3>

    <div class="form-field">
      <label><input type="checkbox" id="dcDeliveryEnabled"> Domicilio activo</label>
      <span class="dc-inherited" id="dcDeliveryEnabledInherited"></span>
    </div>
    <div class="form-field">
      <label><input type="checkbox" id="dcPickupEnabled"> Recogida activa</label>
      <span class="dc-inherited" id="dcPickupEnabledInherited"></span>
    </div>

    <div class="form-field">
      <label for="dcDeliveryFee">Tarifa de domicilio</label>
      <input id="dcDeliveryFee" class="form-input" type="number" min="0" step="100">
      <span class="dc-inherited" id="dcDeliveryFeeInherited"></span>
    </div>
    <div class="form-field">
      <label for="dcMinOrder">Pedido mínimo</label>
      <input id="dcMinOrder" class="form-input" type="number" min="0" step="100">
      <span class="dc-inherited" id="dcMinOrderInherited"></span>
    </div>
    <div class="form-field">
      <label for="dcRadiusKm">Radio de cobertura (km)</label>
      <input id="dcRadiusKm" class="form-input" type="number" min="0.1" step="0.5">
      <span class="dc-inherited" id="dcRadiusKmInherited"></span>
    </div>
    <div class="form-field">
      <label for="dcPrepMinutes">Tiempo de preparación (min)</label>
      <input id="dcPrepMinutes" class="form-input" type="number" min="1" step="5">
      <span class="dc-inherited" id="dcPrepMinutesInherited"></span>
    </div>

    <div class="form-field">
      <label>Métodos de pago aceptados (en la mesa y en domicilios)</label>
      <div id="dcPaymentMethods" style="display:flex;flex-wrap:wrap;gap:12px;margin-top:4px;">
        <label style="display:flex;align-items:center;gap:4px;font-weight:400;"><input type="checkbox" class="dc-pm" value="efectivo"> Efectivo</label>
        <label style="display:flex;align-items:center;gap:4px;font-weight:400;"><input type="checkbox" class="dc-pm" value="tarjeta"> Datáfono (tarjeta)</label>
        <label style="display:flex;align-items:center;gap:4px;font-weight:400;"><input type="checkbox" class="dc-pm" value="nequi"> Nequi</label>
        <label style="display:flex;align-items:center;gap:4px;font-weight:400;"><input type="checkbox" class="dc-pm" value="bancolombia"> Bancolombia</label>
      </div>
      <span class="dc-inherited" id="dcPaymentMethodsInherited"></span>
    </div>

    <div class="form-field">
      <label for="dcPhone">Teléfono público de la sede</label>
      <input id="dcPhone" class="form-input" type="text" placeholder="3001234567">
    </div>

    <div class="form-field">
      <label for="dcPublicLink">Enlace de pedidos (uno por organización)</label>
      <div style="display:flex;gap:8px;">
        <input id="dcPublicLink" class="form-input" type="text" readonly>
        <button class="btn" id="dcCopyLinkBtn" type="button">Copiar</button>
      </div>
    </div>

    <div id="dcError" style="color:#e5484d;font-size:13px;margin-top:8px;display:none;"></div>

    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
      <button class="btn" id="deliveryConfigModalCancel">Cancelar</button>
      <button class="btn brand" id="deliveryConfigModalSubmit">Guardar</button>
    </div>
    <button class="icon-btn" id="deliveryConfigModalClose" style="position:absolute;top:16px;right:16px;" aria-label="Cerrar modal">&#x2715;</button>
  </div>
</div>

<script src="/static/js/mesio-utils.js"></script>
<script src="/static/js/pages/sidebar.js"></script>
<script src="/static/js/pages/locations.js"></script>
</body>
</html>
