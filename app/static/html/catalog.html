<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú del Restaurante</title>
<script>
  // Redirect to /menu/{table_id} (path param) if table_id is present in query string,
  // otherwise fall back to /menu with the full query string (legacy).
  (function() {
    var params = new URLSearchParams(window.location.search);
    var tableId = params.get('table_id');
    var hash = window.location.hash;
    if (tableId) {
      // table_id is now encoded in the path — no extra params needed.
      // bot_number and mesa are redundant: the API derives them from the table.
      // Forwarding mesa=8-1 would cause catalog-v2.js to call /menu-context/8-1
      // instead of /menu-context/table-8-1, returning 404.
      window.location.replace('/menu/' + encodeURIComponent(tableId) + hash);
    } else {
      window.location.replace('/menu' + window.location.search + hash);
    }
  })();
</script>
</head>
<body>
  <p>Redirigiendo al menú...</p>
</body>
</html>
