# Railway build configuration.
# Adds postgresql v17 client tools (pg_dump, psql) so scripts/rehearsal_railway.py
# can dump the Railway-hosted Postgres v17 server (apt's postgresql-client is v16
# which aborts with a version-mismatch error against v17 servers).
#
# nixPkgs replaces the auto-detected package list, so we re-include python + gcc
# that nixpacks would normally provide for the Python builder to work.

[phases.setup]
nixPkgs = ["python312", "gcc", "postgresql_17"]
